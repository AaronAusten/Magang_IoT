<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – SAIL</title>
  <link rel="stylesheet" href="../Homepage/sail-unified.css">
</head>
<body>
  <div class="top-bar">
    <div class="brand">
      <div class="brand-name">SAIL</div>
      <div class="brand-sub">Support Operational System</div>
    </div>
    <div class="nav-hint">Register</div>
  </div>
  <div class="page-center">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-body">
        <div class="card-icon">👤</div>
        <div class="card-title">Create Account</div>
        <div class="card-desc">Register to get access to the SAIL operational dashboard.</div>
        <form onsubmit="register(event)">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input class="form-input" type="text" id="username" placeholder="your_username">
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" type="email" id="email" placeholder="user@sail.id" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input class="form-input" type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirm-password">Confirm Password</label>
              <input class="form-input" type="password" id="confirm-password" placeholder="••••••••" required>
            </div>
          </div>
          <button type="submit" class="btn-primary">Next →</button>
        </form>
      </div>
      <div class="card-footer">
        <a href="../Homepage/Homepage.html" class="card-link">Already have an account? Sign in</a>
        <div class="card-note">Only registered users can access the system</div>
      </div>
    </div>
  </div>
  <script src="Register.js"></script>
</body>
</html>
